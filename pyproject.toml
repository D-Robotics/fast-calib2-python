[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fast-calib2-python"
version = "0.1.0"
description = "Python reference implementation for FAST-Calib2 LiDAR-camera calibration"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "D-Robotics" }]
dependencies = [
  "numpy>=1.23",
  "opencv-contrib-python>=4.7",
  "PyYAML>=6.0",
]

[project.urls]
Homepage = "https://github.com/D-Robotics/fast-calib2-python"
Repository = "https://github.com/D-Robotics/fast-calib2-python"

[tool.setuptools]
py-modules = []
